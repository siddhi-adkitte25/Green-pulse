# JWT Secret - Must be at least 64 characters for HS512
jwt.secret=EnvironmentBackendSuperSecureSecretKeyForJWTTokenGeneration2024MustBeAtLeast64CharactersLong
jwt.expiration=86400000

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/environment_db
spring.datasource.username=root
spring.datasource.password=cdac

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# Temporary fix for circular dependency
spring.main.allow-circular-references=true

# Razorpay Configuration
razorpay.key.id=your_razorpay_key_id
razorpay.key.secret=your_razorpay_key_secret